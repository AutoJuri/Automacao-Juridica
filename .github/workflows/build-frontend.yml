name: build-frontend

# Build da imagem e publico no GHCR. A VPS (Coolify) roda a imagem pronta.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/autojuri/automacao-juridica-frontend
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VITE_API_URL=https://automacao-juridica.abneraijiner.com.br
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Avisar o Coolify (se o webhook estiver configurado)
        if: github.ref == 'refs/heads/main'
        env:
          HOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
        run: |
          if [ -n "$HOOK" ]; then
            curl -fsS -X POST "$HOOK" && echo "Coolify notificado." || echo "Aviso ao Coolify falhou (seguindo)."
          fi
