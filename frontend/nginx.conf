server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: todas as rotas vao pro index (TanStack Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # assets estaticos com cache longo (hash no nome)
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
}
